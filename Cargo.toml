[package]
# The identifier: the exe, the Cargo package, the GitHub repository, the
# single-instance names. The display name is the same ("qslides", main.rs,
# setup.iss, build.rs and the READMEs).
name = "qslides"
# Between releases: the next version with "-dev", the last number raised by
# one (after 0.1.0, "0.1.1-dev"); a release drops it.
version = "0.1.0-dev"
authors = ["Fan4_Metal"]
edition = "2024"
# One sentence, English: it is shown in About, in the exe's version
# resource (build.rs) and as the README tagline.
description = "A desktop photo frame that shows pictures and videos from your folders"
license = "MIT"
repository = "https://github.com/Fan4Metal/qslides"

[dependencies]
# glow, not the default wgpu: a smaller binary and a faster start (an OpenGL
# context is created in ~130 ms against ~240 ms for wgpu on DX12). eframe's
# default features are off: no accesskit, no wgpu and no `links` (URLs are
# opened through win::shell_open instead of ui.hyperlink_to).
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.36"
# The folder dialog without default features: only windows-sys,
# raw-window-handle and log are pulled in.
rfd = { version = "0.17.2", default-features = false }
raw-window-handle = "0.6"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
# Keep the feature list minimal; add a feature only for an API that is used.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",            # GetUserDefaultUILanguage (i18n)
    "Win32_Graphics_Gdi",             # WNDCLASSW (one instance), MonitorFromWindow
    "Win32_Networking_WinHttp",       # the update check
    "Win32_Security",                 # CreateMutexW's attributes (one instance)
    "Win32_System_Console",           # AttachConsole for the command line modes
    "Win32_System_DataExchange",      # WM_COPYDATA (one instance)
    "Win32_System_LibraryLoader",     # GetModuleHandleW (one instance, the tray icon)
    "Win32_System_Registry",          # start with Windows (the Run key)
    "Win32_System_Threading",         # CreateMutexW (one instance)
    "Win32_UI_Shell",                 # ShellExecuteW, the tray icon, the window subclass
    "Win32_UI_WindowsAndMessaging",   # menus, window positions
] }
# COM interfaces with their wrappers, as in qrec and metalamp: Media
# Foundation decodes the videos, WIC the pictures, ITaskbarList takes the
# taskbar button away.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",         # the video decoded on the graphics card
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem", # the date a photo was taken (its caption)
] }
# Named by the code `#[implement]` generates (the Media Engine's callback,
# audio.rs); already a dependency of `windows`, the same version.
windows-core = "0.62"

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon and the version information into the exe.
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A panic ends the process; main::install_panic_hook shows it first.
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Dependencies optimised in debug builds too, so that a debug build is usable.
[profile.dev.package."*"]
opt-level = 3
# No debug info for dependencies: it made most of target/debug's size.
debug = false
